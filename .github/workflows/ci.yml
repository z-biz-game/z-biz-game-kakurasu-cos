name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The rule, the solver, the generator and the shipped pool are all pure ES modules: no
  # browser and no install step. Two rows are the reason this job exists:
  #   * anchor.test.mjs — the whole 4x4 space is enumerated and the four measured anchors are
  #     reproduced against hand-typed expectations: 65536 boards partition into 64959 clue
  #     classes by two independent routes, 64382 of them unique and 577 multiple, and the
  #     subset DP agrees with the cell-by-cell backtracker on 400 sampled classes;
  #   * lots.test.mjs — re-counts and re-measures every row in js/data/lots.js, so a
  #     hand-edited `solutions`/`depth` or a stale bake fails the build instead of shipping.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: npm run check
      - name: Suites
        run: npm run unit
      # 文档行号对账：两份文档里的每一条 `path:行号` 读回盘上核对。它跑在 node 侧、不碰 Chrome，
      # 所以放在 unit 这一份作业里；本地整闸 tools/verify.sh 跑的是同一条命令，不是两份清单。
      - name: Doc citations reconcile (文档行号对账)
        run: node tools/docs-test.mjs
      # 部署集闸：按 tools/assemble-site.sh 那份清单真拷一遍产物，要求页面会去要的东西
      # 都在里面。这一仓曾经因为清单落后于页面而线上 404 自己的 manifest/sw.js/图标，
      # 而本地一切全绿——因为本地根本没有「按清单拷」这一步。
      - name: Deploy set gate
        run: node tools/deploy-set.mjs
      # 阴性自证：每一类断言当场被打红一次，闸必须点名吃掉那一刀；写在注释里的假路径
      # 必须不算引用。钉住的条数由这一跑证明它真的会红，不是由记性证明。
      - name: Deploy set gate proves it can fail
        run: node tools/deploy-set-selftest.mjs

  # The shell is only proven by driving a real page with real mouse events: the canvas hit
  # test, the over-sum rule, the drag-to-paint run and the save file live behind `window.kakurasu`.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Headless playtest
        env:
          SKIP_UNIT: 1
          WD_TIMEOUT: 240
        run: bash tools/verify.sh
